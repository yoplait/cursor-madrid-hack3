<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hack3 · LibreYOLO</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Detección LibreYOLO</h1>
      <p>Sube una imagen y el backend en <code>/detect</code> devuelve las cajas detectadas.</p>

      <form id="form">
        <input type="file" id="file" accept="image/*" required />
        <label>
          conf
          <input type="number" id="conf" min="0" max="1" step="0.05" value="0.25" />
        </label>
        <button type="submit">Detectar</button>
      </form>

      <section id="preview">
        <img id="image" alt="preview" hidden />
      </section>

      <pre id="output">Esperando imagen…</pre>
    </main>
    <script src="app.js"></script>
  </body>
</html>
