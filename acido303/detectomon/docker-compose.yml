services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      BACKEND_HOST: "0.0.0.0"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
      - ./backend/static:/app/static

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: "http://backend:8000"
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
