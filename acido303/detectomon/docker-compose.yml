services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      BACKEND_HOST: "0.0.0.0"
    volumes:
      - ./backend/models:/app/models

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: "http://backend:8000"
      VITE_WS_URL: "ws://localhost:8000/ws/detect"
    depends_on:
      - backend
